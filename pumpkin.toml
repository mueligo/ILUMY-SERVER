# ==========================================
# ILUMY Pumpkin Minecraft Server Config
# Optimized for Hostless (0.5 vCPU / 1GB RAM)
# Cracked / Offline Mode Enabled
# ==========================================

default_difficulty = "Normal"
op_permission_level = 4
allow_nether = true
allow_end = true
hardcore = false
allow_chat_reports = false

[commands]
default_op_level = 4 # Semua user yang baru masuk langsung mendapatkan permission Operator tertinggi (Level 4)

[networking.java]
enabled = true
address = "0.0.0.0:25565"
online_mode = false # Izinkan akun crack/offline
encryption = false
max_players = 20
view_distance = 8   # Dioptimasi hemat RAM & CPU
simulation_distance = 6
motd = "ILUMY Pumpkin Server (Cracked OK)"

[networking.java.authentication]
enabled = false # Nonaktifkan auth Mojang agar pemain crack bisa masuk

[networking.bedrock]
enabled = false

[pvp]
enabled = true
hurt_animation = true
knockback = true

[player_data]
save_player_data = true
save_player_cron_interval = 60
